android.useAndroidX=true
# Настройки AndroidX (у вас уже есть)
android.useAndroidX=true

# Настройки памяти для Gradle (РЕШЕНИЕ ПРОБЛЕМЫ OOM)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# (Опционально) Уменьшить параллелизм, если памяти всё равно не хватает
org.gradle.workers.max=2

# (Опционально) Включить кэширование для ускорения сборок
org.gradle.caching=true
