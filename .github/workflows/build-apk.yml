
name: Build clean APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project structure
        shell: bash
        run: |
          set -e
          echo "Checking project files..."
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Project files found."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check backup source
        shell: bash
        run: |
          echo "=== Backup.kt ==="
          ls -l app/src/main/java/com/example/carmaintenance/Backup.kt
          grep -nE 'fun (createBackupJson|restoreBackupJson)' app/src/main/java/com/example/carmaintenance/Backup.kt
          echo "=== Kotlin source files ==="
          find app/src/main/java -name "*.kt" -type f

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Car-Maintenance-Clean-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
